        function generateNextTicketId(ticketType) {
            let prefix = 'AVE';
            if (ticketType === 'Tickets de Backbone') prefix = 'BKN';
            if (ticketType === 'Tickets de Requerimiento') prefix = 'RQM';

            const recycled = getRecycledIds();
            if (recycled[prefix] && recycled[prefix].length > 0) {
                recycled[prefix].sort((a, b) => a - b);
                const recycledNum = recycled[prefix].shift();
                saveRecycledIds(recycled);
                return `${prefix}-${recycledNum}`;
            }

            return `${prefix}-${Math.floor(10000 + Math.random() * 90000)}`;
        }

            const typeClass = type === 'success'

            const iconColor = type === 'success' ? 'text-green-500' : 'text-rose-500';

            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5 ${iconColor}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {

                setTimeout(() => toast.remove(), 300);

            const end = endIso ? new Date(endIso) : new Date();
            const diffMs = end - start;
            if (diffMs < 0) return { text: '0h 0m', ms: 0 };
            const hrs = Math.floor(diffMs / (1000 * 60 * 60));
            const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            return { text: `${hrs}h ${mins}m`, ms: diffMs };
        }

        function renderLoginScreen() {

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const user = getUsers().find(u => u.email === email && u.pass === pass);

            if (user) {
                setCurrentUser(user);
                showToast(`Bienvenido, ${user.name}`, 'success');
                renderApp();
            } else {
                showToast('Credenciales incorrectas.', 'error');
            }
        }

        function logout() {
            setCurrentUser(null);
            renderApp();
        }

        function renderDashboardView() {
            const tickets = getTickets();
            const searchQ = document.getElementById('dash-search')?.value.toLowerCase() || '';
            const statusF = document.getElementById('dash-status-filter')?.value || 'all';
            const typeF = document.getElementById('dash-type-filter')?.value || 'all';

            const filteredTickets = tickets.filter(t => {
                const matchSearch = t.id.toLowerCase().includes(searchQ) || t.elementCode.toLowerCase().includes(searchQ) || t.nodo.toLowerCase().includes(searchQ) || (t.distrito && t.distrito.toLowerCase().includes(searchQ));
                const matchStatus = statusF === 'all' || t.status === statusF;
                const matchType = typeF === 'all' || t.ticketType === typeF;
                return matchSearch && matchStatus && matchType;
            });

            const totalClients = tickets.reduce((acc, t) => acc + (t.affectedClients || 0), 0);
            const pendCount = tickets.filter(t => t.status === 'pendiente').length;
            const procCount = tickets.filter(t => t.status === 'en_proceso').length;
            const finCount = tickets.filter(t => t.status === 'finalizado').length;

            const nodeMap = {}; 
            tickets.forEach(t => { nodeMap[t.nodo] = (nodeMap[t.nodo] || 0) + 1; });
            const topNodes = Object.entries(nodeMap).sort((a,b) => b[1] - a[1]).slice(0, 4);

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        ${renderKpiCard('Clientes Afectados', totalClients.toLocaleString(), 'users', 'text-slate-500', 'bg-slate-100 text-slate-600 dark:bg-slate-800/50')}
                        ${renderKpiCard('Tickets Totales', tickets.length, 'ticket', 'text-blue-500', 'bg-blue-50 text-blue-600 dark:bg-blue-500/10')}
                        ${renderKpiCard('Pendientes (Cola)', pendCount, 'clock', 'text-amber-500', 'bg-amber-50 text-amber-600 dark:bg-amber-500/10')}
                        ${renderKpiCard('En Proceso', procCount, 'activity', 'text-sky-500', 'bg-sky-50 text-sky-600 dark:bg-sky-500/10')}
                        ${renderKpiCard('Finalizados', finCount, 'check-circle', 'text-winet-500', 'bg-winet-50 text-winet-600 dark:bg-winet-500/10')}
                    </div>

                    <div class="grid grid-cols-1 gap-6">
                        <div class="bg-white dark:bg-[#0a110c] p-5 rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex flex-col">
                            <h3 class="text-sm font-bold text-slate-800 dark:text-white flex items-center gap-2 mb-4">
                                <i data-lucide="bar-chart-2" class="w-4 h-4 text-winet-500"></i> Top Nodos Afectados
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                                ${topNodes.map(([node, count], idx) => `
                                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-[#020503] border border-slate-100 dark:border-[#122b1c] text-sm">
                                        <div class="flex items-center gap-3">
                                            <span class="font-bold text-slate-400">#${idx+1}</span>
                                            <span class="font-semibold text-slate-700 dark:text-stone-200">${node}</span>
                                        </div>
                                        <span class="px-2.5 py-1 rounded-lg bg-winet-100 text-winet-700 dark:bg-winet-900/30 dark:text-winet-400 font-bold">${count}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-[#0a110c] rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-200 dark:border-[#122b1c] bg-slate-50 dark:bg-[#08120c] flex flex-wrap items-center justify-between gap-4">
                            <div class="flex flex-wrap items-center gap-3 flex-1">
                                <div class="relative min-w-[240px]">
                                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                                    <input type="text" id="dash-search" oninput="renderApp()" value="${searchQ}" placeholder="Buscar Ticket, Nodo, Distrito..." class="w-full bg-white dark:bg-[#020503] border border-slate-300 dark:border-[#122b1c] text-sm rounded-lg pl-9 pr-4 py-2 text-slate-900 dark:text-white focus:outline-none">
                                </div>

                                <select id="dash-status-filter" onchange="renderApp()" class="bg-white dark:bg-[#020503] border border-slate-300 dark:border-[#122b1c] text-sm rounded-lg px-3 py-2 text-slate-700 dark:text-white font-semibold focus:outline-none">
                                    <option value="all">Todos los Estatus</option>
                                    <option value="pendiente" ${statusF==='pendiente'?'selected':''}>Pendiente</option>
                                    <option value="en_proceso" ${statusF==='en_proceso'?'selected':''}>En Proceso</option>
                                    <option value="finalizado" ${statusF==='finalizado'?'selected':''}>Finalizado</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="switchView('new_ticket')" class="px-4 py-2 rounded-lg bg-winet-600 hover:bg-winet-700 text-white text-sm font-bold flex items-center gap-2 transition-all shadow-sm">
                                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Registrar Avería
                                </button>
                                <button onclick="exportToCSV()" class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-[#122b1c] dark:text-stone-300 text-sm font-bold flex items-center gap-2 transition-all">
                                    <i data-lucide="download" class="w-4 h-4"></i> Exportar CSV
                                </button>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-white dark:bg-[#030905] text-slate-500 dark:text-stone-400 border-b border-slate-200 dark:border-[#122b1c] uppercase tracking-wider font-semibold text-xs">
                                        <th class="py-3 px-4">Ticket ID</th>
                                        <th class="py-3 px-4">Motivo de Solicitud</th>
                                        <th class="py-3 px-4">Elemento Afectado</th>
                                        <th class="py-3 px-4">Clientes / Distrito</th>
                                        <th class="py-3 px-4">Coordenadas GPS</th>
                                        <th class="py-3 px-4">Asignación y Contratista</th>
                                        <th class="py-3 px-4">Tiempo / Estatus</th>
                                        <th class="py-3 px-4 text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-[#122b1c]">
                                    ${filteredTickets.map(t => renderTicketRow(t)).join('') || `<tr><td colspan="8" class="py-12 text-center text-slate-500">No hay tickets.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderKpiCard(title, value, icon, iconColor, iconBg) {
            return `
                <div class="bg-white dark:bg-[#0a110c] p-5 rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex items-center justify-between">
                    <div>
                        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">${title}</div>
                        <div class="text-2xl font-black text-slate-900 dark:text-white mt-1">${value}</div>
                    </div>
                    <div class="p-3 rounded-xl ${iconBg}">
                        <i data-lucide="${icon}" class="w-6 h-6 ${iconColor}"></i>
                    </div>
                </div>
            `;
        }

        function renderTicketRow(t) {
            let typeStyle = 'bg-rose-100 text-rose-800 dark:bg-rose-500/10 dark:text-rose-400 border-rose-200 dark:border-rose-500/20'; 
            if (t.ticketType === 'Tickets de Backbone') typeStyle = 'bg-purple-100 text-purple-800 dark:bg-purple-500/10 dark:text-purple-400 border-purple-200 dark:border-purple-500/20'; 
            if (t.ticketType === 'Tickets de Requerimiento') typeStyle = 'bg-blue-100 text-blue-800 dark:bg-blue-500/10 dark:text-blue-400 border-blue-200 dark:border-blue-500/20'; 

            let statusStyle = 'bg-amber-100 text-amber-800 dark:bg-amber-500/10 dark:text-amber-400 border-amber-200 dark:border-amber-500/20';
            let statusText = 'Pendiente';
            if (t.status === 'en_proceso') { statusStyle = 'bg-sky-100 text-sky-800 dark:bg-sky-500/10 dark:text-sky-400 border-sky-200 dark:border-sky-500/20'; statusText = 'En Proceso'; }
            if (t.status === 'finalizado') { statusStyle = 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/10 dark:text-emerald-400 border-emerald-200 dark:border-emerald-500/20'; statusText = 'Finalizado'; }

            const lat = t.coords?.lat !== undefined ? t.coords.lat : -12.0464;
            const lng = t.coords?.lng !== undefined ? t.coords.lng : -77.0428;
            const coordsConcatenated = `${lat}, ${lng}`;
            const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

            const closureTime = t.closureData?.closedAt || null;
            const refDate = t.requestDate ? t.requestDate : t.createdAt;
            const elapsed = getElapsedTime(refDate, t.status === 'finalizado' ? closureTime : null);

            return `
                <tr class="hover:bg-slate-50 dark:hover:bg-[#030a05] transition-colors group cursor-pointer" onclick="openTicketDetailModal('${t.id}')">
                    <td class="py-3 px-4" onclick="event.stopPropagation()">
                        <div class="font-mono font-bold text-slate-900 dark:text-white">${t.id}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5">Req: ${formatCustomDate(t.requestDate || t.createdAt)}</div>
                    </td>
                    <td class="py-3 px-4" onclick="event.stopPropagation()">
                        <span class="inline-block px-2 py-0.5 rounded border text-[11px] font-bold ${typeStyle}">${t.ticketType}</span>
                        <div class="text-[11px] text-slate-500 mt-1">Cat: <b class="text-slate-700 dark:text-stone-300 uppercase">${t.category}</b></div>
                    </td>
                    <td class="py-3 px-4" onclick="event.stopPropagation()">
                        <div class="font-bold text-slate-800 dark:text-stone-200 text-xs">${t.elementType || 'Elemento'}</div>
                        <div class="text-[11px] font-mono text-winet-600 mt-0.5">${t.elementCode || 'S/N'}</div>
                    </td>
                    <td class="py-3 px-4" onclick="event.stopPropagation()">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-rose-600 dark:text-rose-400">
                            <i data-lucide="users" class="w-3.5 h-3.5"></i> ${t.affectedClients} Afectados
                        </div>
                        <div class="text-[11px] font-bold text-slate-700 dark:text-stone-300 mt-1 uppercase">Distrito: ${t.distrito || 'N/A'}</div>
                        <div class="text-[10px] text-slate-400">${t.nodo}</div>
                    </td>
                    <td class="py-3 px-4 font-mono text-xs" onclick="event.stopPropagation()">
                        <a href="${googleMapsUrl}" target="_blank" class="text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1 font-bold" title="Abrir en Google Maps">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${coordsConcatenated}
                        </a>
                        <span class="text-[10px] text-slate-400 block mt-0.5">Google Maps ↗</span>
                    </td>
                    <td class="py-3 px-4" onclick="event.stopPropagation()">
                        <div class="text-xs font-bold text-slate-800 dark:text-stone-200 flex items-center gap-1.5 mb-0.5">
                            <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i> Sup: ${t.supervisor || 'Sin Asignar'}
                        </div>
                        <div class="text-[11px] font-bold text-winet-600 flex items-center gap-1.5 mb-0.5 uppercase">
                            <i data-lucide="briefcase" class="w-3.5 h-3.5"></i> Contratista: ${t.contractor || 'Ninguna'}
                        </div>
                        <div class="text-[10px] font-semibold text-slate-500 flex items-center gap-1.5">
                            <i data-lucide="shield" class="w-3.5 h-3.5"></i> Brigada: ${t.brigada || 'Sin Brigada'}
                        </div>
                    </td>
                    <td class="py-3 px-4" onclick="event.stopPropagation()">
                        <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-lg bg-amber-50 text-amber-700 dark:bg-amber-500/10 border border-amber-200 font-mono font-bold text-[11px] mb-1">
                            <i data-lucide="timer" class="w-3 h-3"></i> ${elapsed.text}
                        </div>
                        <div class="flex flex-col gap-1 items-start">
                            <span class="px-2 py-0.5 rounded border text-[10px] font-bold uppercase tracking-wider ${statusStyle}">${statusText}</span>
                            <select onchange="updateTicketStatus('${t.id}', this.value)" class="text-[10px] font-bold bg-white dark:bg-[#020503] border border-slate-200 dark:border-[#122b1c] rounded px-1 py-0.5 text-slate-600 dark:text-stone-400 focus:outline-none">
                                <option value="pendiente" ${t.status==='pendiente'?'selected':''}>Pendiente</option>
                                <option value="en_proceso" ${t.status==='en_proceso'?'selected':''}>En Proceso</option>
                                <option value="finalizado" ${t.status==='finalizado'?'selected':''}>Finalizado</option>
                            </select>
                        </div>
                    </td>
                    <td class="py-3 px-4 text-right" onclick="event.stopPropagation()">
                        <div class="flex items-center justify-end gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="quickTelegramModal('${t.id}')" class="p-1.5 rounded-md hover:bg-slate-200 dark:hover:bg-[#122b1c] text-blue-600" title="Telegram">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                            <button onclick="openEditTicketModal('${t.id}')" class="p-1.5 rounded-md hover:bg-slate-200 dark:hover:bg-[#122b1c] text-slate-600 dark:text-stone-300" title="Editar">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            ${t.status !== 'finalizado' ? `
                                <button onclick="openClosureModal('${t.id}')" class="p-1.5 rounded-md hover:bg-winet-100 text-winet-600" title="Cerrar Avería">
                                    <i data-lucide="check-square" class="w-4 h-4"></i>
                                </button>
                            ` : `
                                <button onclick="viewClosureDetails('${t.id}')" class="p-1.5 rounded-md hover:bg-slate-200 text-slate-600" title="Ver Cierre">
                                    <i data-lucide="eye" class="w-4 h-4"></i>
                                </button>
                            `}
                            <button onclick="deleteTicketPrompt('${t.id}')" class="p-1.5 rounded-md hover:bg-rose-100 text-rose-600" title="Eliminar Registro">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function openTicketDetailModal(id) {
            const t = getTickets().find(x => x.id === id);
            if (!t) return;
            const lat = t.coords?.lat || -12.0464;
            const lng = t.coords?.lng || -77.0428;
            const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

            openModal(`
                <div class="bg-white dark:bg-[#0a110c] rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 dark:border-[#122b1c] max-h-[92vh] flex flex-col">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100 dark:border-[#122b1c] flex-shrink-0">
                        <div>
                            <h3 class="text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">
                                Ticket Detalle • <span class="text-winet-600 font-mono">${t.id}</span>
                            </h3>
                            <p class="text-xs text-slate-500">Solicitud: ${formatCustomDate(t.requestDate || t.createdAt)}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="${googleMapsUrl}" target="_blank" class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold flex items-center gap-1.5 hover:underline">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Abrir en Google Maps ↗
                            </a>
                            <button onclick="closeModal(); openEditTicketModal('${t.id}')" class="px-3 py-1.5 bg-slate-100 dark:bg-[#122b1c] text-slate-700 dark:text-stone-300 rounded-lg text-xs font-bold flex items-center gap-1">
                                <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Editar
                            </button>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>

        function confirmDeleteTicket(id) {
            let tickets = getTickets();
            const ticketToDelete = tickets.find(t => t.id === id);

            if (ticketToDelete && ticketToDelete.id) {
                const parts = ticketToDelete.id.split('-');
                if (parts.length === 2) {
                    const prefix = parts[0];
                    const num = parseInt(parts[1], 10);
                    if (!isNaN(num)) {
                        const recycled = getRecycledIds();
                        if (!recycled[prefix]) recycled[prefix] = [];
                        if (!recycled[prefix].includes(num)) {
                            recycled[prefix].push(num);
                            saveRecycledIds(recycled);
                        }
                    }
                }
            }

            tickets = tickets.filter(t => t.id !== id);
            saveTickets(tickets);
            closeModal();
            renderApp();
            showToast(`Ticket ${id} eliminado. ID reciclado.`, 'success');
        }

        function formatCustomDate(iso) {
            if(!iso) return '';
            const d = new Date(iso);
            if(isNaN(d.getTime())) return iso;
            return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function exportToCSV() {
            const tickets = getTickets();
            if(tickets.length === 0) return showToast('No hay datos', 'error');
            const headers = ['ID Ticket', 'Fecha Solicitud', 'Estado', 'Clientes', 'Nodo', 'Distrito', 'Supervisor', 'Contratista'];
            const rows = tickets.map(t => [t.id, t.requestDate || '', t.status, t.affectedClients, t.nodo, t.distrito, t.supervisor || '', t.contractor || '']);
            const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.map(String).map(s=>`"${s.replace(/"/g, '""')}"`).join(','))].join('\n');
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `WINET_PEXT_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('CSV Descargado', 'success');
        }

        function addClosureMaterial() {
            const select = document.getElementById('mat-select');
            const qtyInput = document.getElementById('mat-qty');
            const name = select.value;
            const qty = parseInt(qtyInput.value);

            if (!name || isNaN(qty) || qty <= 0) return showToast('Seleccione material y cantidad', 'error');

            const existingIdx = tempMaterials.findIndex(m => m.name === name);
            if (existingIdx > -1) tempMaterials[existingIdx].qty += qty;
            else tempMaterials.push({ name, qty });

            select.value = '';
            qtyInput.value = '';
            renderClosureMaterialsList();
        }

        function removeClosureMaterial(idx) {
            tempMaterials.splice(idx, 1);
            renderClosureMaterialsList();
        }

        function renderClosureMaterialsList() {
            const listEl = document.getElementById('closure-materials-list');
            if (tempMaterials.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-500 italic">No hay materiales registrados.</p>';
                return;
            }
            listEl.innerHTML = tempMaterials.map((m, idx) => `
                <div class="flex items-center justify-between bg-white dark:bg-[#0a110c] p-2 rounded border border-slate-200 dark:border-[#122b1c] text-sm">
                    <span class="text-slate-700 dark:text-stone-300"><strong class="text-slate-900 dark:text-white">${m.qty}x</strong> ${m.name}</span>

            lucide.createIcons();

        function handleClosure(e, id) {
            e.preventDefault();
            const tickets = getTickets();
            const t = tickets.find(x => x.id === id);
            t.status = 'finalizado';
            
            const safeRead = (elemId) => { const el = document.getElementById(elemId); return el ? el.value : ''; };
            const isGisShown = document.getElementById('gis-closure-section') && !document.getElementById('gis-closure-section').classList.contains('hidden');

            t.closureData = {
                startTime: safeRead('cl-start') || '08:00',
                endTime: safeRead('cl-end') || '10:00',
                cause: safeRead('cl-cause') || 'Sin Causa',
                solution: safeRead('cl-sol') || 'Sin Solución',
                materials: [...tempMaterials],
                gisCatastro: isGisShown ? { status: safeRead('cl-gis-status'), kmz: safeRead('cl-gis-kmz'), obs: safeRead('cl-gis-obs') } : null,
                closedAt: new Date().toISOString()
            };
            
            saveTickets(tickets); 
            showToast(`Ticket ${id} cerrado.`, 'success'); 
            closeModal(); 
            renderApp();

        function importExcelDatabase(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            showToast('Procesando archivo Excel...', 'success');

            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    if(rows.length === 0) return showToast('El archivo Excel está vacío.', 'error');

                    const tickets = getTickets();
                    let importedCount = 0;

                    rows.forEach(row => {
                        const getVal = (kw) => { const k = Object.keys(row).find(x => kw.some(w => x.toLowerCase().includes(w))); return k ? row[k] : ''; };
                        const newId = getVal(['id', 'ticket', 'codigo']) || `AVE-${Math.floor(100000 + Math.random() * 900000)}`;
                        if(tickets.find(t => t.id === String(newId))) return;

                        let lat = parseFloat(getVal(['latitud', 'lat']));
                        let lng = parseFloat(getVal(['longitud', 'lng', 'lon']));
                        
                        tickets.push({
                            id: String(newId),
                            requestDate: getVal(['fecha', 'solicitud']) || new Date().toISOString(),
                            createdAt: new Date().toISOString(),
                            ticketType: getVal(['tipo', 'averia']) || 'Avería Clientes Loss',
                            category: getVal(['categoria']) || 'AVERIA',
                            reportArea: getVal(['area']) || 'Calidad Operativa',
                            affectedClients: parseInt(getVal(['afectados', 'clientes'])) || 1,
                            elementType: getVal(['elemento']) || 'CAJA CTO',
                            elementCode: getVal(['codigo_elemento']) || 'S/N',
                            coords: { lat: isNaN(lat) ? -12.9897768 : lat, lng: isNaN(lng) ? -77.0909098 : lng },
                            nodo: getVal(['nodo']) || 'SIN NODO',
                            project: getVal(['proyecto']) || 'N/A',
                            distrito: getVal(['distrito']) || 'LIMA',
                            zone: getVal(['zona']) || 'LIMA',
                            details: getVal(['detalles', 'observacion']) || 'Importado de Excel',
                            status: 'pendiente',
                            closureData: null
                        });
                        importedCount++;
                    });

                    saveTickets(tickets);
                    showToast(`Importados ${importedCount} tickets.`, 'success');
                    renderApp();
                } catch(err) {
                    showToast('Error leyendo Excel.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            e.target.value = '';
        }

        let analyticsCharts = [];
        function renderAnalyticsView() {

            tickets.forEach(t => {
                if(t.status === 'finalizado' && t.closureData?.closedAt) {

                    if(diff > 0) { totalHours += (diff / (1000 * 60 * 60)); slaTickets++; }

                                <div class="min-w-[420px] w-[450px] max-h-full flex flex-col bg-slate-50 dark:bg-[#050a07] rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm">
                                    <div class="p-4 border-b border-slate-200 dark:border-[#122b1c] bg-white dark:bg-[#0a110c] rounded-t-2xl flex justify-between items-center sticky top-0 z-10">
                                        <h3 class="font-bold text-slate-800 dark:text-white text-sm">${sup}</h3>
                                        <span class="bg-slate-200 dark:bg-[#122b1c] text-xs px-2.5 py-1 rounded-full font-bold">${supTickets.length}</span>
                                    </div>
                                    <div class="flex-1 overflow-y-auto p-3 space-y-3">
                                        ${supTickets.map(t => renderQueueCard(t, supervisors)).join('') || `<div class="text-center text-xs text-slate-400 py-6 border-2 border-dashed border-slate-200 dark:border-[#122b1c] rounded-xl">Sin tickets</div>`}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderQueueCard(t, supervisors) {
            const refDate = t.requestDate || t.createdAt;
            const elapsed = getElapsedTime(refDate);
            let typeStyle = 'bg-rose-100 text-rose-800 dark:bg-rose-500/10 dark:text-rose-400';
            if (t.ticketType === 'Tickets de Backbone') typeStyle = 'bg-purple-100 text-purple-800 dark:bg-purple-500/10 dark:text-purple-400';
            if (t.ticketType === 'Tickets de Requerimiento') typeStyle = 'bg-blue-100 text-blue-800 dark:bg-blue-500/10 dark:text-blue-400';

            return `
                <div class="bg-white dark:bg-[#0a110c] p-4 rounded-xl border border-slate-200 dark:border-[#122b1c] shadow-sm space-y-3 cursor-pointer hover:border-winet-500 transition-all group" onclick="openTicketDetailModal('${t.id}')">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-mono font-bold text-slate-900 dark:text-white text-sm">${t.id}</span>
                            <div class="text-xs text-slate-500">Req: ${formatCustomDate(t.requestDate || t.createdAt)}</div>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded border font-bold ${typeStyle}">${t.ticketType}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 bg-slate-50 dark:bg-[#020503] p-2.5 rounded-lg text-xs">
                        <div><span class="text-[10px] text-slate-400 uppercase">Clientes</span><div class="font-bold text-rose-500">${t.affectedClients}</div></div>
                        <div><span class="text-[10px] text-slate-400 uppercase">Distrito</span><div class="font-bold uppercase">${t.distrito}</div></div>
                        <div><span class="text-[10px] text-slate-400 uppercase">Contratista</span><div class="font-bold text-winet-600">${t.contractor || 'N/A'}</div></div>
                        <div><span class="text-[10px] text-slate-400 uppercase">Brigada</span><div class="font-bold">${t.brigada || 'N/A'}</div></div>
                    </div>

                    <div class="flex items-center justify-between pt-1" onclick="event.stopPropagation()">
                        <span class="font-mono text-xs text-amber-600">⏱ ${elapsed.text}</span>
                        <select onchange="updateTicketSupervisor('${t.id}', this.value)" class="text-[11px] font-semibold bg-slate-50 dark:bg-[#020503] border border-slate-200 dark:border-[#122b1c] rounded p-1">
                            <option value="">Sin Asignar</option>
                            ${supervisors.map(s => `<option value="${s}" ${t.supervisor === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                    </div>

                    <div onclick="event.stopPropagation()">
                        ${t.status !== 'finalizado' ? `<button onclick="openClosureModal('${t.id}')" class="w-full py-1.5 bg-winet-600 text-white rounded-lg text-xs font-bold flex justify-center items-center gap-1">Cerrar Ticket</button>` : `<button onclick="viewClosureDetails('${t.id}')" class="w-full py-1.5 bg-slate-100 dark:bg-[#122b1c] text-xs font-bold">Ver Cierre</button>`}
                    </div>
                </div>
            `;
        }

        function updateTicketSupervisor(id, sup) {
            const tickets = getTickets();
            const t = tickets.find(x => x.id === id);
            t.supervisor = sup || null;
            saveTickets(tickets);
            showToast('Supervisor reasignado', 'success');
            renderApp();
        }

        window.onload = function() { renderApp(); };
    </script>
</body>
</html>
